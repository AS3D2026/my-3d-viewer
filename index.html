<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <!-- Google Model Viewer Script -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #f5f5f5; }
    model-viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <!-- Replace model.glb with your file name if different -->
  <model-viewer 
    src="model.glb" 
    alt="3D Model" 
    ar 
    auto-rotate 
    camera-controls>
  </model-viewer>

</body>
</html>
